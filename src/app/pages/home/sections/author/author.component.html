<section id="author" class="relative flex min-h-screen items-center justify-center overflow-hidden bg-black/10 px-6 py-20">
  <!-- =====================================================
       SOFT LIGHT
       Ánh sáng trắng/xám rất nhẹ phía sau avatar
       ===================================================== -->

  <div class="author-glow absolute left-[25%] top-1/2 z-[1] h-[450px] w-[450px] -translate-x-1/2 -translate-y-1/2 rounded-full bg-gray-100/80 blur-[100px]"></div>

  <!-- =====================================================
       CONTENT
       ===================================================== -->

  <div class="author-content relative z-10 flex w-full max-w-6xl flex-col items-center gap-14 lg:flex-row lg:justify-center lg:gap-24">
    <!-- ===================================================
         AVATAR
         =================================================== -->

    <div class="author-image-wrapper">
      <div class="author-avatar relative h-64 w-64 overflow-hidden rounded-full shadow-[0_20px_80px_rgba(0,0,0,0.15)] md:h-80 md:w-80">
        <img src="/assets/images/author-removebg.png" alt="Dương Thụy" class="h-full w-full object-contain scale-120" />
      </div>
    </div>

    <!-- ===================================================
         AUTHOR INFORMATION
         =================================================== -->

    <div class="author-info max-w-xl text-center text-black lg:text-left">
      <!-- Label -->

      <p class="author-label mb-5 font-sans text-xs uppercase tracking-[0.35em] text-black/50">Tác giả</p>

      <!-- Name -->

      <h2 class="author-name font-display text-6xl font-medium italic leading-none md:text-7xl">Dương Thụy</h2>

      <!-- Divider -->

      <div class="author-divider my-7 flex items-center justify-center gap-4 lg:justify-start">
        <span class="h-px w-16 bg-black/30"></span>

        <span class="font-display text-xl text-black/50"> Paris </span>
      </div>

      <!-- Description -->

      <p class="author-description font-sans text-base leading-8 text-black/60 md:text-lg">
        Dương Thụy là một trong những cây bút viết về những chuyến đi, những thành phố và những câu chuyện tình yêu với một góc nhìn nhẹ nhàng, gần gũi.
      </p>

      <!-- Quote -->

      <blockquote class="author-quote mt-8 border-l border-black/20 pl-5 font-display text-xl italic leading-relaxed text-black/70">
        “Có những thành phố chỉ cần một lần đặt chân tới, đã đủ để nhớ suốt một đời.”
      </blockquote>

      <!-- CTA -->
    </div>
  </div>
</section>
