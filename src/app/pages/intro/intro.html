<div class="intro">

  <!-- BACKGROUND -->
  <div class="intro-background">

    <!-- Grain -->
    <div class="intro-grain"></div>

    <!-- Organic stains -->
    <span class="stain stain-1"></span>
    <span class="stain stain-2"></span>
    <span class="stain stain-3"></span>
    <span class="stain stain-4"></span>
    <span class="stain stain-5"></span>
    <span class="stain stain-6"></span>

    <!-- Soft paper waves -->
    <span class="paper-wave wave-1"></span>
    <span class="paper-wave wave-2"></span>
    <span class="paper-wave wave-3"></span>

  </div>


  <!-- CONTENT -->
  <main class="intro-content">

    <div class="logo-stage">

      <!-- Ripple -->
      <span class="ripple ripple-1"></span>
      <span class="ripple ripple-2"></span>
      <span class="ripple ripple-3"></span>
      <span class="ripple ripple-4"></span>
      <span class="ripple ripple-5"></span>
      <span class="ripple ripple-6"></span>

      <!-- Decorative rings -->
      <span class="logo-ring ring-1"></span>
      <span class="logo-ring ring-2"></span>
      <span class="logo-ring ring-3"></span>

      <!-- Logo -->
      <div class="logo-circle">

        <img
          class="intro-logo"
          src="/assets/images/logo.png"
          alt="Pages To Places"
          draggable="false"
        />

      </div>

    </div>

  </main>


  <!-- LOADING -->
  <footer class="intro-footer">

    <div class="loading-meta">

      <span>LOADING</span>

      <span class="intro-progress-text">
        00%
      </span>

    </div>

    <div class="intro-progress">
      <div class="intro-progress-bar"></div>
    </div>

  </footer>

</div>
